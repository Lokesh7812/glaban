kind = "web"
previewPath = "/"
title = "G Laban - Arabian Desserts"
version = "1.0.0"
id = "artifacts/g-laban"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23235

[services.development]
run = "pnpm --filter @workspace/g-laban run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/g-laban", "run", "build" ]
publicDir = "artifacts/g-laban/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23235"
BASE_PATH = "/"
